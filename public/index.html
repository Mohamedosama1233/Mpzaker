<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مذاكر</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@700&display=swap">
<style>
:root{--paper:#edf1f7;--card:#fff;--ink:#18263b;--muted:#566781;--rule:#d3dce9;--margin:#d4443f;--pen:#2456c9;--pen-soft:#e1e9fb;--on-pen:#fff;--danger:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#111c2a;--card:#182739;--ink:#e7edf5;--muted:#9fb0c4;--rule:#25384f;--margin:#ff7b76;--pen:#84a6ff;--pen-soft:#22365a;--on-pen:#0d1828;--danger:#ff9a93;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.7 "IBM Plex Sans Arabic",Tahoma,system-ui,sans-serif;padding:20px max(16px,env(safe-area-inset-left)) 12px max(16px,env(safe-area-inset-right))}
.shell{max-width:720px;margin:auto;display:flex;flex-direction:column;gap:14px}
h1{font:700 2.1rem/1.2 "Reem Kufi",Tahoma,sans-serif;margin:0}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tag{margin:0;color:var(--muted);font-size:.95rem}
.setup{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.setup label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
.setup .wide{grid-column:1/-1}
select,input,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:9px 12px;min-width:0}
select,input{min-height:44px}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.log{background:var(--card) repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--rule) 31px,var(--rule) 32px);border:1px solid var(--rule);border-inline-start:3px solid var(--margin);border-radius:6px;padding:16px;min-height:46vh;display:flex;flex-direction:column;gap:14px}
.hint{margin:0;color:var(--muted);background:var(--card);align-self:flex-start;padding-inline:6px}
.msg{max-width:94%;padding:10px 14px 12px;border-radius:14px;min-width:0}
.msg .who{display:block;font:700 .8rem "Reem Kufi",Tahoma,sans-serif;color:var(--muted)}
.msg .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-start;background:var(--pen-soft)}
.msg.bot{align-self:flex-end;background:var(--paper);border:1px solid var(--rule)}
.msg.err .txt{color:var(--danger)}
.msg img{display:block;max-width:100%;max-height:200px;border-radius:8px;margin-top:6px}
.composer{position:sticky;bottom:0;background:var(--paper);padding:8px 0;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;max-height:140px;line-height:1.5}
.btn{font:600 1rem inherit;font-family:inherit;color:var(--on-pen);background:var(--pen);border:0;border-radius:10px;min-height:44px;padding-inline:18px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--pen);border:1.5px solid var(--pen)}
.btn[disabled]{opacity:.5;cursor:default}
.preview{display:flex;align-items:center;gap:10px}
.preview img{height:56px;border-radius:8px}
.note{margin:0;font-size:.82rem;color:var(--muted)}
</style>
</head>
<body>
<div class="shell">
  <header class="top"><h1>مذاكر</h1><p class="tag">صاحبك في مذاكرة الثانوية العامة</p></header>

  <section class="setup">
    <label for="name" class="wide">اسمك (اختياري)
      <input id="name" maxlength="30" placeholder="مثلًا: أحمد" autocomplete="off">
    </label>
    <label for="grade">الصف
      <select id="grade"><option>أولى ثانوي</option><option>تانية ثانوي</option><option selected>تالتة ثانوي (الثانوية العامة)</option></select>
    </label>
    <label for="subject">المادة
      <select id="subject">
        <option>عام (أي مادة)</option><option>اللغة العربية</option><option>اللغة الإنجليزية</option><option>اللغة الأجنبية التانية</option>
        <option>الرياضيات (جبر وهندسة فراغية)</option><option>التفاضل والتكامل</option><option>الفيزياء</option><option>الكيمياء</option>
        <option>الأحياء</option><option>الجيولوجيا</option><option>التاريخ</option><option>الجغرافيا</option>
        <option>الفلسفة والمنطق</option><option>علم النفس والاجتماع</option><option>التربية الدينية</option>
      </select>
    </label>
  </section>

  <main class="log" id="log" aria-live="polite">
    <p class="hint" id="hint">اسأل عن درس، أو صوّر مسألة وابعتها.</p>
  </main>

  <form class="composer" id="form">
    <div class="preview" id="preview" hidden><img id="thumb" alt="الصورة المرفقة"><button type="button" class="btn ghost" id="rm">شيل الصورة</button></div>
    <div class="row">
      <input type="file" id="file" accept="image/*" hidden>
      <button type="button" class="btn ghost" id="pick" aria-label="أرفق صورة">صورة</button>
      <textarea id="msg" rows="1" placeholder="اكتب سؤالك هنا" aria-label="رسالتك"></textarea>
      <button type="submit" class="btn" id="send">ابعت</button>
    </div>
  </form>
  <p class="note">مذاكر بيجاوب من مصادر المنهج المضافة بس، وممكن يغلط. راجع مدرسك في المهم. بنسجل عدد رسائلك والمواد اللي بتسأل فيها للمتابعة، ومش بنسجل نص أسئلتك.</p>
</div>

<script>
(function () {
  var $ = function (i) { return document.getElementById(i); };
  var log = $("log"), msg = $("msg"), send = $("send"), turns = [], image = "", busy = false;

  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function put(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  var sid = get("mk-sid");
  if (!sid) {
    sid = (self.crypto && crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + "-" + Math.random().toString(16).slice(2, 10)).toLowerCase();
    put("mk-sid", sid);
  }
  ["name", "grade", "subject"].forEach(function (id) {
    var el = $(id), v = get("mk-" + id);
    if (v) { if (el.tagName === "SELECT") { for (var i = 0; i < el.options.length; i++) if (el.options[i].text === v) el.selectedIndex = i; } else el.value = v; }
    el.addEventListener("change", function () { put("mk-" + id, el.value); });
  });

  function bubble(kind, who, text, img) {
    var d = document.createElement("div"); d.className = "msg " + kind;
    var w = document.createElement("span"); w.className = "who"; w.textContent = who;
    var t = document.createElement("div"); t.className = "txt"; t.textContent = text;
    d.appendChild(w); d.appendChild(t);
    if (img) { var im = document.createElement("img"); im.src = img; im.alt = "صورتك"; d.appendChild(im); }
    log.appendChild(d); return t;
  }
  function grow() { msg.style.height = "auto"; msg.style.height = Math.min(msg.scrollHeight, 140) + "px"; }
  msg.addEventListener("input", grow);

  $("pick").onclick = function () { $("file").click(); };
  $("rm").onclick = function () { image = ""; $("preview").hidden = true; $("file").value = ""; };
  $("file").onchange = function () {
    var f = this.files && this.files[0]; if (!f) return;
    var fr = new FileReader();
    fr.onload = function () {
      var im = new Image();
      im.onload = function () {
        var max = 1280, s = Math.min(1, max / Math.max(im.width, im.height));
        var c = document.createElement("canvas"); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        image = c.toDataURL("image/jpeg", 0.8);
        $("thumb").src = image; $("preview").hidden = false;
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(f);
  };

  var ERR = { upstream_429: "الرسائل كترت. استنى دقيقة وجرب تاني.", server_not_configured: "الموقع لسه مش متظبط. كلم صاحبه.", bad_image: "الصورة مش مناسبة. جرب صورة تانية." };

  $("form").addEventListener("submit", async function (e) {
    e.preventDefault();
    var text = msg.value.trim();
    if (busy || (!text && !image)) return;
    if (!text) text = "حل المسألة اللي في الصورة.";
    var hint = $("hint"); if (hint) hint.remove();
    var sentImage = image;
    bubble("me", "انت", text, sentImage);
    turns.push({ role: "user", content: (sentImage ? "(الطالب بعت صورة) " : "") + text });
    msg.value = ""; grow(); image = ""; $("preview").hidden = true; $("file").value = "";
    var out = bubble("bot", "مذاكر", "بيفكر...");
    busy = true; send.disabled = true;
    window.scrollTo({ top: document.documentElement.scrollHeight });
    try {
      var r = await fetch("/api/chat", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: turns, image: sentImage, grade: $("grade").value, subject: $("subject").value, sid: sid, name: $("name").value })
      });
      var j = await r.json().catch(function () { return {}; });
      if (!r.ok || !j.reply) throw new Error(j.error || "failed");
      out.textContent = j.reply;
      turns.push({ role: "assistant", content: j.reply });
    } catch (err) {
      out.parentNode.classList.add("err");
      out.textContent = ERR[err.message] || "حصلت مشكلة في الاتصال. ابعت رسالتك تاني.";
    } finally {
      busy = false; send.disabled = false;
      window.scrollTo({ top: document.documentElement.scrollHeight });
    }
  });
})();
</script>
</body>
</html>
