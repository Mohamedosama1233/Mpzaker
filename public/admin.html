<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>داشبورد مذاكر</title>
<style>
:root{--paper:#edf1f7;--card:#fff;--ink:#18263b;--muted:#566781;--rule:#d3dce9;--pen:#2456c9;--on-pen:#fff;--danger:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#111c2a;--card:#182739;--ink:#e7edf5;--muted:#9fb0c4;--rule:#25384f;--pen:#84a6ff;--on-pen:#0d1828;--danger:#ff9a93;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 "IBM Plex Sans Arabic",Tahoma,system-ui,sans-serif;padding:20px max(16px,env(safe-area-inset-left)) 20px max(16px,env(safe-area-inset-right))}
.wrap{max-width:860px;margin:auto;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:1.6rem}
.login{display:flex;gap:8px;flex-wrap:wrap}
input{font:inherit;font-size:16px;min-height:44px;padding:8px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--card);color:var(--ink);flex:1;min-width:0}
button{font:inherit;font-weight:600;min-height:44px;padding:0 18px;border:0;border-radius:10px;background:var(--pen);color:var(--on-pen);cursor:pointer}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.sum{display:flex;gap:12px;flex-wrap:wrap}
.sum div{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:10px 16px}
.sum b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--rule);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--rule);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:.85rem}
td.n{font-variant-numeric:tabular-nums}
.err{color:var(--danger);margin:0}
.muted{color:var(--muted);margin:0}
</style>
</head>
<body>
<div class="wrap">
  <h1>داشبورد مذاكر</h1>
  <form class="login" id="f">
    <input type="password" id="pw" placeholder="كلمة سر الداشبورد" autocomplete="current-password" aria-label="كلمة السر">
    <button type="submit">دخول</button>
  </form>
  <p class="err" id="err" hidden></p>
  <div id="out" hidden>
    <div class="sum"><div><span class="muted">عدد الطلاب</span><b id="s1">0</b></div><div><span class="muted">إجمالي الرسائل</span><b id="s2">0</b></div></div>
    <div class="tw"><table><thead><tr><th>الطالب</th><th>الرسائل</th><th>آخر استخدام</th><th>المواد</th></tr></thead><tbody id="tb"></tbody></table></div>
  </div>
</div>
<script>
(function () {
  var $ = function (i) { return document.getElementById(i); };
  function cell(tr, text, cls) { var td = document.createElement("td"); td.textContent = text; if (cls) td.className = cls; tr.appendChild(td); }
  $("f").addEventListener("submit", async function (e) {
    e.preventDefault();
    $("err").hidden = true;
    try {
      var r = await fetch("/api/stats", { headers: { "x-admin-password": $("pw").value } });
      var j = await r.json().catch(function () { return {}; });
      if (r.status === 401) throw new Error("كلمة السر غلط.");
      if (!r.ok) throw new Error("حصلت مشكلة في السيرفر.");
      if (!j.configured) throw new Error("قاعدة البيانات (Upstash) لسه متوصلتش. راجع خطوات الإعداد.");
      var tb = $("tb"); tb.textContent = "";
      var total = 0;
      j.users.forEach(function (u) {
        total += u.msgs;
        var tr = document.createElement("tr");
        cell(tr, u.name || ("طالب " + u.id.slice(0, 6)));
        cell(tr, String(u.msgs), "n");
        cell(tr, u.last ? new Date(u.last).toLocaleString("ar-EG") : "-");
        cell(tr, Object.keys(u.subjects).map(function (s) { return s + " (" + u.subjects[s] + ")"; }).join("، "));
        tb.appendChild(tr);
      });
      $("s1").textContent = String(j.users.length); $("s2").textContent = String(total);
      $("out").hidden = false;
    } catch (er) {
      $("err").textContent = er.message; $("err").hidden = false; $("out").hidden = true;
    }
  });
})();
</script>
</body>
</html>
